name: Deploy to Cloud Run

on:
  push:
    branches:
      - master
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-west1
  SERVICE: parousia-baptist-ministries
  REPOSITORY: straightlinecards
  IMAGE: ${{ secrets.GCP_PROJECT_ID }}/straightlinecards/parousia-baptist-ministries
  CLOUDSQL_INSTANCE: ${{ secrets.GCP_CLOUDSQL_INSTANCE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Ensure persistent asset storage
        run: |
          ASSET_BUCKET="${{ env.PROJECT_ID }}-parousia-assets"
          if ! gcloud storage buckets describe "gs://${ASSET_BUCKET}" --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${ASSET_BUCKET}" \
              --project="${{ env.PROJECT_ID }}" \
              --location="${{ env.REGION }}" \
              --uniform-bucket-level-access
          fi
          gcloud storage buckets add-iam-policy-binding "gs://${ASSET_BUCKET}" \
            --member="serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --role="roles/storage.objectAdmin" \
            --project="${{ env.PROJECT_ID }}" >/dev/null
          if [ -d data/assets ] && [ "$(ls -A data/assets 2>/dev/null)" ]; then
            gcloud storage cp data/assets/* "gs://${ASSET_BUCKET}/" --recursive --no-clobber || true
          fi
          echo "ASSET_BUCKET=${ASSET_BUCKET}" >> "$GITHUB_ENV"

      - name: Mirror live production uploads to asset bucket
        run: |
          PROD_URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --format='value(status.url)')
          mkdir -p /tmp/prod-assets
          curl -fsSL "${PROD_URL}" "${PROD_URL}/free-gift" "${PROD_URL}/devotional" \
            | grep -oE '/api/assets/[^"'"'"'<> ]+' \
            | sed 's|/api/assets/||' \
            | sort -u > /tmp/prod-asset-names.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            curl -fsSL "${PROD_URL}/api/assets/${file}" -o "/tmp/prod-assets/${file}" || true
          done < /tmp/prod-asset-names.txt
          if [ "$(ls -A /tmp/prod-assets 2>/dev/null)" ]; then
            gcloud storage cp /tmp/prod-assets/* "gs://${ASSET_BUCKET}/" --no-clobber || true
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_URI }}
          flags: >-
            --platform=managed
            --execution-environment=gen2
            --port=8080
            --memory=1Gi
            --cpu=1
            --min-instances=1
            --max-instances=3
            --timeout=300
            --concurrency=80
            --allow-unauthenticated
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --add-volume=name=parousia-assets,type=cloud-storage,bucket=${{ env.PROJECT_ID }}-parousia-assets
            --add-volume-mount=volume=parousia-assets,mount-path=/data/assets
            --set-env-vars=NODE_ENV=production,DATA_DIR=/data
            --set-secrets=DATABASE_URL=PAROUSIA_DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,SESSION_SECRET=SESSION_SECRET:latest,ADMIN_ACCESS_CODE=ADMIN_ACCESS_CODE:latest,SUPER_ADMIN_EMAIL=SUPER_ADMIN_EMAIL:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,SENDGRID_FROM_EMAIL=SENDGRID_FROM_EMAIL:latest,SENDGRID_FROM_NAME=SENDGRID_FROM_NAME:latest
