services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parousia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parousia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
      PGSSLMODE: disable
      # Inside Compose, the database host is the service name `postgres`.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parousia
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/data

  # Hot-reload dev server. Usage: docker compose --profile dev up
  app-dev:
    profiles: ["dev"]
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PGSSLMODE: disable
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parousia
    env_file:
      - .env.local
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
  dev_node_modules:
  dev_app_data:
